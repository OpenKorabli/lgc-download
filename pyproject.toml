[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgc-download"
version = "0.2.0"
description = "Download and extract Lesta game files (Mir Korabley, Mir Tankov, Tanks Blitz) from the LGC API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "py7zr>=1.0",
]

[project.scripts]
lgc-download = "lgc_download.cli:main"

[project.urls]
Homepage = "https://github.com/Monstrofil/lgc-download"

[tool.setuptools.packages.find]
where = ["src"]
